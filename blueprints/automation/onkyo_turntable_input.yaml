blueprint:
  name: Onkyo Bridge - Turntable Power Draw switches to LINE 1
  description: >
    When the turntable starts drawing power (measured by a smart plug that
    stays switched on, e.g. IKEA GRILLPLATS), wake the Onkyo receiver and
    switch it to LINE 1, where the turntable is connected.

    The trigger is the plug's power sensor (W) rising above a threshold, not
    the plug's on/off state. Pick a threshold above the turntable's standby
    draw and below what it uses while running; check the sensor's history for
    both values. The sensor must cross the threshold to trigger, so a
    turntable that is already running when Home Assistant starts does nothing.

    Two commands are sent in sequence: `ri-on` over the wired RI bus (discrete,
    safe to send even if the receiver is already on; it also wakes the receiver
    from standby, which IR alone may not do) and `line1` over IR (selects the
    input rather than toggling anything, so it is safe to repeat).

    Optionally the receiver is put in standby when the turntable has drawn
    less than the threshold for a while. This is off by default, because the
    receiver might be in use for something else (AirPlay, TV) by then.

    Uses the same `rest_command.onkyo_remote` as the other Onkyo Bridge
    blueprints, defined once in configuration.yaml:

    ```yaml
    rest_command:
      onkyo_remote:
        url: "http://{{ host }}/api/remote/send?cmd={{ cmd }}"
        method: GET
        timeout: 5
    ```

    The bridge's own completion check is known to misreport failure even
    when the command reached the receiver correctly (see docs/HARDWARE.md in
    sonarkon/Slop-Assistant) - a non-2xx response is not treated as fatal.
  domain: automation
  source_url: https://github.com/sonarkon/Slop-Assistant

  input:
    power_entity:
      name: Turntable power sensor
      description: >
        The power sensor (W) of the plug the turntable is connected to, e.g.
        sensor.plattenspieler_power.
      selector:
        entity:
          domain: sensor
          device_class: power

    power_threshold:
      name: Power threshold (W)
      description: >
        The turntable counts as "in use" above this value. Choose something
        between its idle and running draw.
      default: 2
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          unit_of_measurement: W
          mode: box

    on_delay:
      name: Switch-on debounce (seconds)
      description: >
        How long the power must stay above the threshold before the receiver
        is switched. Filters short spikes, e.g. when the plug is plugged in.
      default: 3
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: s
          mode: box

    onkyo_host:
      name: Onkyo bridge address
      description: >
        IP address or mDNS hostname of the ESP32 running the airplay-esp32
        firmware, e.g. 192.168.178.57 or ESP32-AirPlay.local.
      selector:
        text:

    input_switch_delay:
      name: Input switch delay (seconds)
      description: >
        How long to wait after the wake command before sending the input
        command. Gives the receiver a moment to settle after waking from
        standby before it reliably accepts the next IR command.
      default: 2
      selector:
        number:
          min: 0
          max: 15
          unit_of_measurement: s
          mode: box

    power_off_enabled:
      name: Standby when the turntable stops
      description: >
        Put the receiver in standby after the turntable has stayed below the
        threshold for the delay below. Note that this also cuts AirPlay or TV
        sound if you switch the receiver to those inputs in the meantime.
      default: false
      selector:
        boolean:

    power_off_delay:
      name: Standby delay (seconds)
      description: How long the draw must stay below the threshold before the receiver goes to standby.
      default: 300
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: box

mode: restart

triggers:
  - trigger: numeric_state
    entity_id: !input power_entity
    above: !input power_threshold
    for:
      seconds: !input on_delay
    id: turntable_on

  - trigger: numeric_state
    entity_id: !input power_entity
    below: !input power_threshold
    for:
      seconds: !input power_off_delay
    id: turntable_off

variables:
  host: !input onkyo_host
  power_off_enabled: !input power_off_enabled

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: turntable_on
        sequence:
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: ri-on
          - delay:
              seconds: !input input_switch_delay
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: line1

      - conditions:
          - condition: trigger
            id: turntable_off
          - condition: template
            value_template: "{{ power_off_enabled }}"
        sequence:
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: ri-off
