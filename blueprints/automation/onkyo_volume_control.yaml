blueprint:
  name: Onkyo Bridge - Volume & Mute Control via Webhook
  description: >
    Forward the LG Magic Remote's volume and mute keys to the Onkyo
    receiver, via three incoming webhooks — volume up, volume down, and
    mute. Pairs with lginputhook on a rooted LG webOS TV: the TV intercepts
    Magic Remote keypresses at the kernel level and fires these webhooks,
    bypassing LG's firmware lockout that otherwise disables the volume keys
    once the TV's audio output is set to optical.

    Uses the airplay-esp32 firmware's REST API (`/api/remote/send?cmd=...`)
    instead of the older ESPHome button entities. `volup`/`voldown`/`mute`
    are all relative/toggle IR commands — each webhook call sends exactly
    one step, matching one physical keypress. Do not add retries or repeats
    around this: sending the same command twice moves the volume twice, or
    toggles mute back off.

    The mute webhook also sends `opt` first, selecting the TV's optical
    input before muting — the Magic Remote's mute key is pressed while
    watching TV, so this guards against muting while the receiver is on a
    different input for some other reason. `opt` is safe to send every
    time: it selects the optical input rather than toggling anything, so it
    never undoes itself, unlike `mute`.

    Requires one `rest_command` defined once in configuration.yaml (shared
    with the Onkyo Bridge - Power & Input Sync blueprint, if also in use):

    ```yaml
    rest_command:
      onkyo_remote:
        url: "http://{{ host }}/api/remote/send?cmd={{ cmd }}"
        method: GET
        timeout: 5
    ```

    Also requires lginputhook installed on the rooted LG webOS TV,
    configured to POST to the webhook URLs on keypress.
  domain: automation
  source_url: https://github.com/sonarkon/Slop-Assistant

  input:
    webhook_id_up:
      name: Webhook ID - Volume Up
      description: >
        The webhook ID for volume up. Must match what lginputhook POSTs to.
        The full URL will be http://[HA-IP]:8123/api/webhook/[this-id]
      default: onkyo_volume_up
      selector:
        text:

    webhook_id_down:
      name: Webhook ID - Volume Down
      description: >
        The webhook ID for volume down. Must match what lginputhook POSTs to.
      default: onkyo_volume_down
      selector:
        text:

    webhook_id_mute:
      name: Webhook ID - Mute
      description: >
        The webhook ID for mute. Must match what lginputhook POSTs to.
      default: onkyo_mute
      selector:
        text:

    onkyo_host:
      name: Onkyo bridge address
      description: >
        IP address or mDNS hostname of the ESP32 running the airplay-esp32
        firmware, e.g. 192.168.178.57 or ESP32-AirPlay.local.
      selector:
        text:

mode: parallel
max: 10

triggers:
  - trigger: webhook
    webhook_id: !input webhook_id_up
    allowed_methods:
      - POST
    local_only: true
    id: vol_up

  - trigger: webhook
    webhook_id: !input webhook_id_down
    allowed_methods:
      - POST
    local_only: true
    id: vol_down

  - trigger: webhook
    webhook_id: !input webhook_id_mute
    allowed_methods:
      - POST
    local_only: true
    id: mute

variables:
  host: !input onkyo_host

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: mute
        sequence:
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: opt
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: mute
    default:
      - action: rest_command.onkyo_remote
        data:
          host: "{{ host }}"
          cmd: "{{ 'volup' if trigger.id == 'vol_up' else 'voldown' }}"
