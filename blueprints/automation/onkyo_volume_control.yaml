blueprint:
  name: Onkyo Bridge - Volume Control via Webhook
  description: >
    Forward the LG Magic Remote's volume keys to the Onkyo receiver, via two
    incoming webhooks — one for volume up, one for volume down. Pairs with
    lginputhook on a rooted LG webOS TV: the TV intercepts Magic Remote
    volume keypresses (Linux key codes 114/115) at the kernel level and
    fires these webhooks, bypassing LG's firmware lockout that otherwise
    disables the volume keys once the TV's audio output is set to optical.

    Uses the airplay-esp32 firmware's REST API (`/api/remote/send?cmd=...`)
    instead of the older ESPHome button entities. `volup`/`voldown` are
    relative, non-idempotent IR commands — each webhook call sends exactly
    one step, matching one physical keypress. Do not add retries or repeats
    around this: sending the same volume command twice moves the volume
    twice.

    Requires one `rest_command` defined once in configuration.yaml (shared
    with the Onkyo Bridge - Power & Input Sync blueprint, if also in use):

    ```yaml
    rest_command:
      onkyo_remote:
        url: "http://{{ host }}/api/remote/send?cmd={{ cmd }}"
        method: GET
        timeout: 5
    ```

    Also requires lginputhook installed on the rooted LG webOS TV,
    configured to POST to the two webhook URLs on volume keypress.
  domain: automation
  source_url: https://github.com/sonarkon/Slop-Assistant

  input:
    webhook_id_up:
      name: Webhook ID - Volume Up
      description: >
        The webhook ID for volume up. Must match what lginputhook POSTs to.
        The full URL will be http://[HA-IP]:8123/api/webhook/[this-id]
      default: onkyo_volume_up
      selector:
        text:

    webhook_id_down:
      name: Webhook ID - Volume Down
      description: >
        The webhook ID for volume down. Must match what lginputhook POSTs to.
      default: onkyo_volume_down
      selector:
        text:

    onkyo_host:
      name: Onkyo bridge address
      description: >
        IP address or mDNS hostname of the ESP32 running the airplay-esp32
        firmware, e.g. 192.168.178.57 or ESP32-AirPlay.local.
      selector:
        text:

mode: parallel
max: 10

triggers:
  - trigger: webhook
    webhook_id: !input webhook_id_up
    allowed_methods:
      - POST
    local_only: true
    id: vol_up

  - trigger: webhook
    webhook_id: !input webhook_id_down
    allowed_methods:
      - POST
    local_only: true
    id: vol_down

variables:
  host: !input onkyo_host

actions:
  - action: rest_command.onkyo_remote
    data:
      host: "{{ host }}"
      cmd: "{{ 'volup' if trigger.id == 'vol_up' else 'voldown' }}"
