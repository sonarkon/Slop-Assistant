blueprint:
  name: Onkyo Bridge - Power & Input Sync with TV and Turntable
  description: >
    Follows two sources and drives the Onkyo receiver accordingly:

    - **TV:** When the TV turns on, wake the receiver and switch it to the
      optical input. When the TV has been off for a while, the receiver goes
      into standby.
    - **Turntable (optional):** When the turntable starts drawing power
      (measured by a smart plug that stays switched on, e.g. IKEA GRILLPLATS),
      wake the receiver and switch it to LINE 1. Leave the power sensor empty
      to skip this part.

    Uses the airplay-esp32 firmware's REST API (`/api/remote/send?cmd=...`)
    instead of the older ESPHome button entities. Waking is done with `ri-on`
    over the wired RI bus (discrete, so it is always safe to send even if the
    receiver is already on; it also wakes the receiver from standby, which IR
    alone may not do). The input is selected over IR with `opt` (TV) or
    `line1` (turntable); both select an input rather than toggling anything,
    so they are safe to repeat. Standby uses `ri-off` (discrete as well: it can
    only switch off, never on by accident).

    Requires one `rest_command` defined once in configuration.yaml:

    ```yaml
    rest_command:
      onkyo_remote:
        url: "http://{{ host }}/api/remote/send?cmd={{ cmd }}"
        method: GET
        timeout: 5
    ```

    The bridge's own completion check is known to misreport failure even
    when the command reached the receiver correctly (see
    docs/HARDWARE.md in sonarkon/Slop-Assistant) - this blueprint does not
    treat a non-2xx response as fatal, it just fires the commands.

    **Standby does not cut a source that is in use:** when the TV has been off
    for the delay, the receiver stays on while the turntable is drawing power;
    when the turntable has stopped, it stays on while the TV is on. The
    TV-off trigger still does not know about AirPlay, so it also cuts AirPlay
    playback if the TV goes off while you are listening that way. If that
    matters, switch the standby legs off or pick a long delay.
  domain: automation
  source_url: https://github.com/sonarkon/Slop-Assistant

  input:
    onkyo_host:
      name: Onkyo bridge address
      description: >
        IP address or mDNS hostname of the ESP32 running the airplay-esp32
        firmware, e.g. 192.168.178.57 or ESP32-AirPlay.local. A static DHCP
        reservation is recommended so this does not need updating later.
      selector:
        text:

    input_switch_delay:
      name: Input switch delay (seconds)
      description: >
        How long to wait after the wake command before sending the input
        command. Gives the receiver a moment to settle after waking from
        standby before it reliably accepts the next IR command.
      default: 2
      selector:
        number:
          min: 0
          max: 15
          unit_of_measurement: s
          mode: box

    tv_entity:
      name: TV
      description: The media_player entity for the TV to follow.
      selector:
        entity:
          domain: media_player

    power_off_enabled:
      name: Standby when the TV goes off
      description: >
        Put the receiver in standby after the TV has been off for the delay
        below. Switch off to leave standby to you (or another automation).
      default: true
      selector:
        boolean:

    power_off_delay:
      name: TV standby delay (seconds)
      description: >
        How long the TV must stay off before the receiver goes to standby. A
        short delay avoids cutting the sound during an accidental TV restart;
        0 switches it off at once. (Earlier versions of this blueprint counted
        this in minutes - an old value of 2 now means 2 seconds.)
      default: 60
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: box

    turntable_power_entity:
      name: Turntable power sensor (optional)
      description: >
        The power sensor (W) of the plug the turntable is connected to, e.g.
        sensor.plattenspieler_power. Leave empty to disable the turntable
        part. The sensor must cross the threshold to trigger, so a turntable
        that is already running when Home Assistant starts does nothing.
      default: []
      selector:
        entity:
          domain: sensor
          device_class: power
          multiple: true

    turntable_threshold:
      name: Turntable power threshold (W)
      description: >
        The turntable counts as "in use" above this value. Choose something
        between its idle and running draw (check the sensor's history).
      default: 2
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          unit_of_measurement: W
          mode: box

    turntable_on_delay:
      name: Turntable switch-on debounce (seconds)
      description: >
        How long the power must stay above the threshold before the receiver
        is switched. Filters short spikes, e.g. when the plug is plugged in.
      default: 3
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: s
          mode: box

    turntable_power_off_enabled:
      name: Standby when the turntable stops
      description: >
        Put the receiver in standby after the turntable has stayed below the
        threshold for the delay below (and the TV is not on). Off by default,
        because the receiver might be in use for AirPlay by then.
      default: false
      selector:
        boolean:

    turntable_power_off_delay:
      name: Turntable standby delay (seconds)
      description: >
        How long the draw must stay below the threshold before the receiver
        goes to standby.
      default: 300
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: box

mode: restart

triggers:
  - trigger: state
    entity_id: !input tv_entity
    to:
      - "on"
      - idle
      - playing
    id: tv_on

  - trigger: state
    entity_id: !input tv_entity
    to: "off"
    for:
      seconds: !input power_off_delay
    id: tv_off

  - trigger: numeric_state
    entity_id: !input turntable_power_entity
    above: !input turntable_threshold
    for:
      seconds: !input turntable_on_delay
    id: turntable_on

  - trigger: numeric_state
    entity_id: !input turntable_power_entity
    below: !input turntable_threshold
    for:
      seconds: !input turntable_power_off_delay
    id: turntable_off

variables:
  host: !input onkyo_host
  tv: !input tv_entity
  power_off_enabled: !input power_off_enabled
  turntable_power_off_enabled: !input turntable_power_off_enabled
  turntable_sensor: !input turntable_power_entity
  turntable_threshold: !input turntable_threshold
  # True while the turntable is drawing power; false if no sensor is set.
  turntable_active: >
    {{ turntable_sensor | length > 0
       and states(turntable_sensor[0]) | float(0) > turntable_threshold | float(0) }}
  tv_active: "{{ is_state(tv, ['on', 'idle', 'playing']) }}"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: tv_on
        sequence:
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: ri-on
          - delay:
              seconds: !input input_switch_delay
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: opt

      - conditions:
          - condition: trigger
            id: tv_off
          - condition: template
            value_template: "{{ power_off_enabled }}"
          - condition: template
            value_template: "{{ not turntable_active }}"
        sequence:
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: ri-off

      - conditions:
          - condition: trigger
            id: turntable_on
        sequence:
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: ri-on
          - delay:
              seconds: !input input_switch_delay
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: line1

      - conditions:
          - condition: trigger
            id: turntable_off
          - condition: template
            value_template: "{{ turntable_power_off_enabled }}"
          - condition: template
            value_template: "{{ not tv_active }}"
        sequence:
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: ri-off
