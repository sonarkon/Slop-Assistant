blueprint:
  name: Onkyo Bridge - Power & Input Sync (TV, Turntable, AirPlay)
  description: |
    The receiver is on while at least one source is active, and goes into
    standby once none is. There is no hand-over between sources: whichever
    source starts last picks the input, and the receiver only switches off
    when the last one has stopped.

    **Sources**

    - **TV:** active while the media_player is on, idle or playing. When it
      turns on, the receiver wakes and switches to the optical input.
    - **Turntable (optional):** active while the plug's power sensor reads
      above a threshold (smart plug that stays switched on, e.g. IKEA
      GRILLPLATS). When it starts drawing power, the receiver wakes and
      switches to LINE 1.
    - **AirPlay (optional):** active while the bridge reports `playing`. The
      bridge wakes the receiver and selects CD/COAX by itself, so there is no
      wake leg for it here; it only keeps the receiver on. It needs a REST
      binary sensor, see below.

    Leave the optional sensors empty to skip those sources.

    **Standby** is sent (`ri-off`) when no source has been active for the
    standby delay. A short pause of a record or an AirPlay track therefore
    does not switch the receiver off if the delay is long enough. An
    unavailable entity counts as inactive.

    Uses the airplay-esp32 firmware's REST API (`/api/remote/send?cmd=...`).
    Waking is `ri-on` over the wired RI bus (discrete: safe to send even if
    the receiver is already on, and it also wakes it from standby, which IR
    alone may not do). The input is selected over IR with `opt` or `line1`;
    both select an input rather than toggling anything, so they are safe to
    repeat. `ri-off` can only switch off, never on by accident.

    Requires, once in configuration.yaml (restart Home Assistant afterwards):

    ```yaml
    rest_command:
      onkyo_remote:
        url: "http://{{ host }}/api/remote/send?cmd={{ cmd }}"
        method: GET
        timeout: 5

    # Only for the AirPlay source. Use the bridge's address.
    rest:
      - resource: http://192.168.178.57/api/remote/status
        scan_interval: 5
        binary_sensor:
          - name: "Onkyo Bridge AirPlay"
            value_template: "{{ value_json.airplay == 'playing' }}"
    ```

    The bridge's own completion check is known to misreport failure even
    when the command reached the receiver correctly (see docs/HARDWARE.md in
    sonarkon/Slop-Assistant) - this blueprint does not treat a non-2xx
    response as fatal, it just fires the commands.
  domain: automation
  source_url: https://github.com/sonarkon/Slop-Assistant

  input:
    onkyo_host:
      name: Onkyo bridge address
      description: >
        IP address or mDNS hostname of the ESP32 running the airplay-esp32
        firmware, e.g. 192.168.178.57 or ESP32-AirPlay.local. A static DHCP
        reservation is recommended so this does not need updating later.
      selector:
        text:

    input_switch_delay:
      name: Input switch delay (seconds)
      description: >
        How long to wait after the wake command before sending the input
        command. Gives the receiver a moment to settle after waking from
        standby before it reliably accepts the next IR command.
      default: 2
      selector:
        number:
          min: 0
          max: 15
          unit_of_measurement: s
          mode: box

    power_off_enabled:
      name: Standby when no source is active
      description: >
        Put the receiver in standby after all sources have been inactive for
        the delay below. Switch off to leave standby to you (or another
        automation).
      default: true
      selector:
        boolean:

    power_off_delay:
      name: Standby delay (seconds)
      description: >
        How long all sources must stay inactive before the receiver goes to
        standby. A short delay avoids cutting the sound during an accidental
        TV restart or a pause; 0 switches it off at once.
      default: 60
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: box

    tv_entity:
      name: TV
      description: The media_player entity for the TV to follow.
      selector:
        entity:
          domain: media_player

    turntable_power_entity:
      name: Turntable power sensor (optional)
      description: >
        The power sensor (W) of the plug the turntable is connected to, e.g.
        sensor.plattenspieler_power. Leave empty to skip the turntable. The
        sensor must cross the threshold to wake the receiver, so a turntable
        that is already running when Home Assistant starts does nothing.
      default: []
      selector:
        entity:
          domain: sensor
          device_class: power
          multiple: true

    turntable_threshold:
      name: Turntable power threshold (W)
      description: >
        The turntable counts as "in use" above this value. Choose something
        between its idle and running draw (check the sensor's history).
      default: 2
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          unit_of_measurement: W
          mode: box

    turntable_on_delay:
      name: Turntable switch-on debounce (seconds)
      description: >
        How long the power must stay above the threshold before the receiver
        is woken. Filters short spikes, e.g. when the plug is plugged in.
      default: 3
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: s
          mode: box

    airplay_entity:
      name: AirPlay playing sensor (optional)
      description: >
        The binary_sensor that is on while the bridge plays AirPlay (the REST
        sensor from the description above, e.g.
        binary_sensor.onkyo_bridge_airplay). Leave empty to ignore AirPlay -
        then the receiver may be switched off while you listen to AirPlay.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

mode: restart

trigger_variables:
  tv: !input tv_entity
  turntable: !input turntable_power_entity
  turntable_threshold: !input turntable_threshold
  airplay: !input airplay_entity

triggers:
  - trigger: state
    entity_id: !input tv_entity
    to:
      - "on"
      - idle
      - playing
    id: tv_on

  - trigger: numeric_state
    entity_id: !input turntable_power_entity
    above: !input turntable_threshold
    for:
      seconds: !input turntable_on_delay
    id: turntable_on

  # Becomes true when the last active source has stopped; fires once it has
  # stayed true for the standby delay.
  - trigger: template
    value_template: >
      {{ not is_state(tv, ['on', 'idle', 'playing'])
         and not (turntable | length > 0
                  and states(turntable[0]) | float(0) > turntable_threshold | float(0))
         and not (airplay | length > 0 and is_state(airplay[0], 'on')) }}
    for:
      seconds: !input power_off_delay
    id: all_off

variables:
  host: !input onkyo_host
  power_off_enabled: !input power_off_enabled

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: tv_on
        sequence:
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: ri-on
          - delay:
              seconds: !input input_switch_delay
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: opt

      - conditions:
          - condition: trigger
            id: turntable_on
        sequence:
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: ri-on
          - delay:
              seconds: !input input_switch_delay
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: line1

      - conditions:
          - condition: trigger
            id: all_off
          - condition: template
            value_template: "{{ power_off_enabled }}"
        sequence:
          - action: rest_command.onkyo_remote
            data:
              host: "{{ host }}"
              cmd: ri-off
