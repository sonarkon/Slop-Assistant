blueprint:
  name: Onkyo Bridge - Power & Input Sync with TV
  description: >
    When the TV turns on, wake the Onkyo receiver and switch it to the
    optical input the TV is connected to.

    Uses the airplay-esp32 firmware's REST API (`/api/remote/send?cmd=...`)
    instead of the older ESPHome button entities. Two commands are sent in
    sequence: `ri-on` over the wired RI bus (discrete, so it is always safe
    to send even if the receiver is already on) and `opt` over IR (also
    safe to repeat — it selects the optical input rather than toggling
    anything).

    Requires one `rest_command` defined once in configuration.yaml:

    ```yaml
    rest_command:
      onkyo_remote:
        url: "http://{{ host }}/api/remote/send?cmd={{ cmd }}"
        method: GET
        timeout: 5
    ```

    The bridge's own completion check is known to misreport failure even
    when the command reached the receiver correctly (see
    docs/HARDWARE.md in sonarkon/Slop-Assistant) — this blueprint does not
    treat a non-2xx response as fatal, it just fires the commands.

    This blueprint only handles turning the receiver on. It intentionally
    does not turn it off when the TV does, since AirPlay playback also
    wakes the receiver independently (see the firmware's own
    `CONFIG_REMOTE_AUTO_INPUT`) and the two should not fight over standby.
  domain: automation
  source_url: https://github.com/sonarkon/Slop-Assistant

  input:
    tv_entity:
      name: TV
      description: The media_player entity for the TV to follow.
      selector:
        entity:
          domain: media_player

    onkyo_host:
      name: Onkyo bridge address
      description: >
        IP address or mDNS hostname of the ESP32 running the airplay-esp32
        firmware, e.g. 192.168.178.57 or ESP32-AirPlay.local. A static DHCP
        reservation is recommended so this does not need updating later.
      selector:
        text:

    input_switch_delay:
      name: Input switch delay (seconds)
      description: >
        How long to wait after the wake command before sending the input
        command. Gives the receiver a moment to settle after waking from
        standby before it reliably accepts the next IR command.
      default: 2
      selector:
        number:
          min: 0
          max: 15
          unit_of_measurement: s
          mode: box

mode: restart

triggers:
  - trigger: state
    entity_id: !input tv_entity
    to:
      - "on"
      - idle
      - playing

variables:
  host: !input onkyo_host

actions:
  - action: rest_command.onkyo_remote
    data:
      host: "{{ host }}"
      cmd: ri-on
  - delay:
      seconds: !input input_switch_delay
  - action: rest_command.onkyo_remote
    data:
      host: "{{ host }}"
      cmd: opt
