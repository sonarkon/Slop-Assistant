<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>S/PDIF-Ausgangsschaltung ESP32-S3 zu Cinch/RCA</title>
<desc>Vollständiges Schema: GPIO12 über Widerstand R1 (270 Ohm) zu Knoten A, von dort über Widerstand R2 (120 Ohm) nach GND und über Kondensator C1 (100 nF) zum Signal-Mittelpin der Cinch-Buchse. Der Schirm der Cinch-Buchse ist getrennt davon direkt mit der gemeinsamen GND-Schiene verbunden, nicht mit dem Mittelpin gebrückt.</desc>
<rect width="680" height="420" fill="#ffffff"/>

<rect x="50" y="120" width="100" height="40" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="100" y="136" font-family="sans-serif" font-size="14" fill="#042C53" text-anchor="middle">ESP32-S3</text>
<text x="100" y="152" font-family="sans-serif" font-size="12" fill="#0C447C" text-anchor="middle">GPIO12</text>

<line x1="150" y1="140" x2="190" y2="140" stroke="#5F5E5A" stroke-width="2"/>
<rect x="190" y="120" width="90" height="40" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
<text x="235" y="136" font-family="sans-serif" font-size="14" fill="#2C2C2A" text-anchor="middle">R1</text>
<text x="235" y="152" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">270 Ohm</text>

<line x1="280" y1="140" x2="320" y2="140" stroke="#5F5E5A" stroke-width="2"/>
<circle cx="320" cy="140" r="6" fill="#2C2C2A"/>
<text x="320" y="110" font-family="sans-serif" font-size="14" fill="#2C2C2A" text-anchor="middle">Knoten A</text>

<line x1="320" y1="140" x2="350" y2="140" stroke="#5F5E5A" stroke-width="2"/>
<rect x="350" y="120" width="90" height="40" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
<text x="395" y="136" font-family="sans-serif" font-size="14" fill="#2C2C2A" text-anchor="middle">C1</text>
<text x="395" y="152" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">100 nF</text>

<line x1="440" y1="140" x2="520" y2="140" stroke="#5F5E5A" stroke-width="2"/>

<line x1="320" y1="140" x2="320" y2="220" stroke="#5F5E5A" stroke-width="2"/>
<rect x="275" y="220" width="90" height="40" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
<text x="320" y="236" font-family="sans-serif" font-size="14" fill="#2C2C2A" text-anchor="middle">R2</text>
<text x="320" y="252" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">120 Ohm</text>
<line x1="320" y1="260" x2="320" y2="330" stroke="#5F5E5A" stroke-width="2"/>

<line x1="90" y1="330" x2="590" y2="330" stroke="#5F5E5A" stroke-width="2"/>
<line x1="90" y1="330" x2="90" y2="300" stroke="#5F5E5A" stroke-width="2"/>
<text x="90" y="290" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">GND Schiene</text>

<rect x="50" y="20" width="110" height="40" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="105" y="36" font-family="sans-serif" font-size="14" fill="#042C53" text-anchor="middle">ESP32-S3</text>
<text x="105" y="52" font-family="sans-serif" font-size="12" fill="#0C447C" text-anchor="middle">GND</text>
<line x1="105" y1="60" x2="105" y2="330" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="4 3"/>

<circle cx="560" cy="140" r="42" fill="none" stroke="#5F5E5A" stroke-width="2"/>
<circle cx="560" cy="140" r="13" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.5"/>
<line x1="520" y1="140" x2="547" y2="140" stroke="#5F5E5A" stroke-width="2"/>

<text x="560" y="75" font-family="sans-serif" font-size="14" fill="#2C2C2A" text-anchor="middle">Cinch Buchse</text>
<line x1="560" y1="98" x2="560" y2="127" stroke="#5F5E5A" stroke-width="1"/>
<text x="560" y="88" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">Signal, Mittelpin</text>

<line x1="590" y1="140" x2="620" y2="140" stroke="#5F5E5A" stroke-width="1"/>
<text x="625" y="145" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="start">Schirm, Außenring</text>

<line x1="560" y1="182" x2="560" y2="330" stroke="#5F5E5A" stroke-width="2"/>
<circle cx="560" cy="330" r="5" fill="#2C2C2A"/>

<text x="320" y="375" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">Mittelpin führt nur über C1 zum Signal. Schirm liegt direkt auf GND, getrennt vom Mittelpin.</text>
</svg>
